server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Esta línea es MAGIA: si no encuentra la ruta, carga el index.html
        # Esto permite que React Router maneje las rutas (ej: /productos, /login)
        try_files $uri $uri/ /index.html;
    }

    # Opcional: Manejo de errores
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}