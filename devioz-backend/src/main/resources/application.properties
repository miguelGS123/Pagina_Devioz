# ========================
# OPTIMIZACIÓN HIKARI (Anti-Bloqueo Hostinger)
# ========================
# Mantiene las conexiones bajas para evitar el error "User exceeded max_connections"
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=HikariPoolDevioz

# ========================
# JPA / Hibernate
# ========================
# 'update' es necesario AHORA para crear las nuevas columnas de envío en la BD.
# Después de que arranque bien, puedes cambiarlo a 'validate'.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

