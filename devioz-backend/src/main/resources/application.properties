# ========================
# OPTIMIZACIÓN HIKARI (CONFIGURACIÓN ESTABLE PARA HOSTINGER)
# ========================
# Tamaño del pool (Hostinger no permite muchas conexiones simultáneas)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Tiempo máximo de vida antes de que Hostinger cierre conexiones
spring.datasource.hikari.max-lifetime=30000
# Tiempo de inactividad permitido antes de ser reemplazada
spring.datasource.hikari.idle-timeout=20000
# Tiempo máximo de espera antes de lanzar timeout
spring.datasource.hikari.connection-timeout=30000

# Validación real compatible con Hikari
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

spring.datasource.hikari.pool-name=HikariPoolDeviozProd

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

