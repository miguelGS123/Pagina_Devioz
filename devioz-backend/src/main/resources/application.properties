# ========================
# OPTIMIZACIÓN PARA HOSTINGER (Anti-Bloqueo)
# ========================
# Esto limita las conexiones para que no te pases del límite de 500/hora
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=HikariPoolDevioz

# ========================
# JPA / Hibernate
# ========================
# ⚠️ Importante: Usa 'validate' ahora que tus tablas existen.
# 'update' intenta modificar la BD en cada reinicio y consume recursos.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

# Se cambió MySQL8Dialect (obsoleto) por MySQLDialect (el estándar actual)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.open-in-view=false

