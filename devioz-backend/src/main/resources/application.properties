# ========================
# OPTIMIZACIÓN HIKARI CP (Estabilidad de Conexión)
# ========================
# Configuración vital para evitar que la conexión se cierre por inactividad
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
# Validación para asegurar que la conexión sigue viva antes de usarla
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.test-while-idle=true
spring.datasource.hikari.validation-query=SELECT 1
spring.datasource.hikari.pool-name=HikariPoolDeviozProd

# ========================
# JPA / Hibernate
# ========================
# 'update': Mantiene los datos y actualiza la estructura si agregas columnas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Evita mantener la conexión abierta innecesariamente en la vista
spring.jpa.open-in-view=false

